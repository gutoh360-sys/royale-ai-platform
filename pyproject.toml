[project]
name = "royale-platform"
version = "0.1.0"
description = "Royale AI Platform - E-commerce Management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "orjson>=3.10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "import-linter>=2.4.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "asgi-lifespan>=1.0.0,<2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "B017", "UP042", "SIM117", "PLC0415", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 30
show_missing = true

[tool.import-linter]
root_package = "backend"

[[tool.import-linter.containers]]
name = "modules"
modules = [
    "backend.core",
    "backend.api",
    "backend.database",
    "backend.modules.catalog",
    "backend.modules.pricing",
    "backend.modules.stock",
    "backend.modules.order",
    "backend.modules.financial",
    "backend.modules.integration",
    "backend.modules.analytics",
    "backend.modules.ai",
    "backend.modules.reports",
]

[[tool.import-linter.forbidden_imports]]
sources = ["backend.modules.*"]
forbidden_modules = ["backend.modules.*"]
allow_indirect_imports = false

[tool.bandit]
exclude = ["/tests/", "/alembic/"]
